<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dental Quote Extractor Ultra</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background-color: #f8f9fa; }
        .card { border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .result-section { background-color: #fff; border-radius: 10px; padding: 20px; margin-bottom: 20px; }
        .treatment-item { border-left: 4px solid #0d6efd; padding-left: 15px; margin-bottom: 10px; }
        .highlight { background-color: #e7f1ff; padding: 5px 10px; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="text-center mb-5">
            <h1 class="display-4">🦷 Dental Quote Extractor Ultra</h1>
            <p class="lead">Extraction avancée de devis dentaires PDF (texte et scannés)</p>
            <div class="badge bg-primary">Version 2.0.0</div>
        </div>

        <!-- Section Upload -->
        <div class="card mb-5">
            <div class="card-header bg-primary text-white">
                <h4>📤 Upload du PDF</h4>
            </div>
            <div class="card-body">
                <div class="row">
                    <div class="col-md-8">
                        <input type="file" class="form-control" id="pdfFile" accept=".pdf">
                        <div class="form-check mt-3">
                            <input class="form-check-input" type="checkbox" id="debugMode">
                            <label class="form-check-label" for="debugMode">
                                Mode Debug (sauvegarde les fichiers intermédiaires)
                            </label>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <button class="btn btn-success w-100" onclick="extractQuote()">
                            <span id="uploadBtnText">Extraire les données</span>
                            <span id="uploadSpinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
                        </button>
                    </div>
                </div>
                <div id="uploadProgress" class="mt-3 d-none">
                    <div class="progress">
                        <div id="progressBar" class="progress-bar progress-bar-striped progress-bar-animated" 
                             role="progressbar" style="width: 0%"></div>
                    </div>
                    <small id="progressText" class="text-muted"></small>
                </div>
            </div>
        </div>

        <!-- Résultats -->
        <div id="results" class="d-none">
            <!-- Métadonnées -->
            <div class="result-section">
                <h4>📊 Métadonnées</h4>
                <div id="metadata" class="row"></div>
            </div>

            <!-- Informations de base -->
            <div class="result-section">
                <h4>👨‍⚕️ Informations</h4>
                <div class="row">
                    <div class="col-md-4">
                        <h6>Dentiste</h6>
                        <div id="dentisteInfo"></div>
                    </div>
                    <div class="col-md-4">
                        <h6>Patient</h6>
                        <div id="patientInfo"></div>
                    </div>
                    <div class="col-md-4">
                        <h6>Devis</h6>
                        <div id="devisInfo"></div>
                    </div>
                </div>
            </div>

            <!-- Traitements -->
            <div class="result-section">
                <h4>🦷 Traitements</h4>
                <div id="treatmentsContainer">
                    <table class="table table-hover" id="treatmentsTable">
                        <thead>
                            <tr>
                                <th>Code</th>
                                <th>Dent</th>
                                <th>Description</th>
                                <th>Honoraires</th>
                                <th>Reste à charge</th>
                            </tr>
                        </thead>
                        <tbody id="treatmentsBody"></tbody>
                    </table>
                </div>
                <div class="mt-3">
                    <canvas id="treatmentsChart" height="100"></canvas>
                </div>
            </div>

            <!-- Résumé financier -->
            <div class="result-section">
                <h4>💰 Résumé financier</h4>
                <div class="row" id="financialSummary"></div>
                <div class="mt-3">
                    <canvas id="financeChart" height="100"></canvas>
                </div>
            </div>

            <!-- Téléchargement JSON -->
            <div class="text-center mt-4">
                <button class="btn btn-outline-primary" onclick="downloadJSON()">
                    📥 Télécharger les données JSON
                </button>
            </div>
        </div>

        <!-- Job Status pour batch -->
        <div id="batchStatus" class="d-none">
            <div class="alert alert-info">
                <h5>Traitement par lot en cours</h5>
                <div id="batchProgress"></div>
                <button class="btn btn-sm btn-outline-info mt-2" onclick="checkBatchStatus()">
                    Actualiser
                </button>
            </div>
        </div>
    </div>

    <script>
        let currentResult = null;
        let currentJobId = null;

        async function extractQuote() {
            const fileInput = document.getElementById('pdfFile');
            const debugMode = document.getElementById('debugMode').checked;
            
            if (!fileInput.files.length) {
                alert('Veuillez sélectionner un fichier PDF');
                return;
            }

            const file = fileInput.files[0];
            const formData = new FormData();
            formData.append('file', file);
            
            // Afficher la progression
            document.getElementById('uploadProgress').classList.remove('d-none');
            document.getElementById('uploadBtnText').textContent = 'Extraction en cours...';
            document.getElementById('uploadSpinner').classList.remove('d-none');
            
            try {
                const response = await fetch('/extract-quote', {
                    method: 'POST',
                    body: formData,
                    headers: {
                        'debug': debugMode.toString()
                    }
                });
                
                if (!response.ok) {
                    throw new Error(`Erreur ${response.status}: ${response.statusText}`);
                }
                
                const result = await response.json();
                currentResult = result;
                
                // Afficher les résultats
                displayResults(result);
                
            } catch (error) {
                alert('Erreur: ' + error.message);
                console.error(error);
            } finally {
                // Réinitialiser UI
                document.getElementById('uploadProgress').classList.add('d-none');
                document.getElementById('uploadBtnText').textContent = 'Extraire les données';
                document.getElementById('uploadSpinner').classList.add('d-none');
                document.getElementById('progressBar').style.width = '0%';
            }
        }

        function displayResults(result) {
            // Afficher la section résultats
            document.getElementById('results').classList.remove('d-none');
            
            // Métadonnées
            const metadataDiv = document.getElementById('metadata');
            const meta = result.api_metadata || {};
            metadataDiv.innerHTML = `
                <div class="col-md-6">
                    <p><strong>Fichier:</strong> ${meta.filename || 'N/A'}</p>
                    <p><strong>Taille:</strong> ${(meta.file_size / 1024).toFixed(2)} KB</p>
                </div>
                <div class="col-md-6">
                    <p><strong>Temps de traitement:</strong> ${meta.processing_time?.toFixed(2)}s</p>
                    <p><strong>Traitements trouvés:</strong> ${result.treatments?.length || 0}</p>
                </div>
            `;
            
            // Informations dentiste
            const dentiste = result.basic_info?.dentiste || {};
            document.getElementById('dentisteInfo').innerHTML = `
                <p><strong>Nom:</strong> ${dentiste.nom_praticien || 'N/A'}</p>
                <p><strong>RPPS:</strong> ${dentiste.rpps || 'N/A'}</p>
                <p><strong>Adresse:</strong> ${dentiste.adresse || 'N/A'}</p>
            `;
            
            // Informations patient
            const patient = result.basic_info?.patient || {};
            document.getElementById('patientInfo').innerHTML = `
                <p><strong>Nom:</strong> ${patient.nom || 'N/A'}</p>
                <p><strong>Date naissance:</strong> ${patient.date_naissance || 'N/A'}</p>
                <p><strong>N° Sécurité sociale:</strong> ${patient.numero_securite_sociale || 'N/A'}</p>
            `;
            
            // Informations devis
            const devis = result.basic_info?.devis || {};
            document.getElementById('devisInfo').innerHTML = `
                <p><strong>Numéro:</strong> ${devis.numero || 'N/A'}</p>
                <p><strong>Date:</strong> ${devis.date_devis || 'N/A'}</p>
                <p><strong>Validité:</strong> ${devis.validite || 'N/A'}</p>
            `;
            
            // Traitements
            const treatmentsBody = document.getElementById('treatmentsBody');
            treatmentsBody.innerHTML = '';
            
            const treatments = result.treatments || [];
            treatments.forEach(t => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td><span class="highlight">${t.code_acte || 'N/A'}</span></td>
                    <td>${t.dent || 'N/A'}</td>
                    <td>${t.description?.substring(0, 80) || ''}...</td>
                    <td>€${t.honoraires?.toFixed(2) || '0.00'}</td>
                    <td>€${t.reste_a_charge?.toFixed(2) || '0.00'}</td>
                `;
                treatmentsBody.appendChild(row);
            });
            
            // Graphique des traitements
            createTreatmentsChart(treatments);
            
            // Résumé financier
            const finance = result.financial_summary || {};
            document.getElementById('financialSummary').innerHTML = `
                <div class="col-md-4">
                    <div class="alert alert-success">
                        <h6>Total Honoraires</h6>
                        <h4>€${finance.honoraires_total?.toFixed(2) || '0.00'}</h4>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="alert alert-warning">
                        <h6>Reste à Charge</h6>
                        <h4>€${finance.reste_a_charge_total?.toFixed(2) || '0.00'}</h4>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="alert alert-info">
                        <h6>Base Remboursement</h6>
                        <h4>€${finance.base_remboursement_total?.toFixed(2) || '0.00'}</h4>
                    </div>
                </div>
            `;
            
            // Graphique financier
            createFinanceChart(finance);
        }

        function createTreatmentsChart(treatments) {
            const ctx = document.getElementById('treatmentsChart').getContext('2d');
            const codes = treatments.map(t => t.code_acte).slice(0, 10);
            const amounts = treatments.map(t => t.honoraires || 0).slice(0, 10);
            
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: codes,
                    datasets: [{
                        label: 'Honoraires (€)',
                        data: amounts,
                        backgroundColor: 'rgba(54, 162, 235, 0.5)',
                        borderColor: 'rgba(54, 162, 235, 1)',
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        title: {
                            display: true,
                            text: 'Répartition des honoraires par acte'
                        }
                    }
                }
            });
        }

        function createFinanceChart(finance) {
            const ctx = document.getElementById('financeChart').getContext('2d');
            
            new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Reste à charge', 'Base remboursement', 'Autres'],
                    datasets: [{
                        data: [
                            finance.reste_a_charge_total || 0,
                            finance.base_remboursement_total || 0,
                            (finance.honoraires_total || 0) - ((finance.reste_a_charge_total || 0) + (finance.base_remboursement_total || 0))
                        ],
                        backgroundColor: [
                            '#ff6384',
                            '#36a2eb',
                            '#cc65fe'
                        ]
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        title: {
                            display: true,
                            text: 'Répartition financière'
                        }
                    }
                }
            });
        }

        function downloadJSON() {
            if (!currentResult) return;
            
            const dataStr = JSON.stringify(currentResult, null, 2);
            const dataBlob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(dataBlob);
            
            const link = document.createElement('a');
            link.href = url;
            link.download = `devis_extraction_${Date.now()}.json`;
            link.click();
            
            URL.revokeObjectURL(url);
        }

        // Gestion des erreurs globales
        window.addEventListener('error', function(e) {
            console.error('Erreur globale:', e.error);
            alert('Une erreur est survenue. Voir la console pour plus de détails.');
        });
    </script>
</body>
</html>
